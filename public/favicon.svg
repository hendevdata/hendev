<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Terminal Symbol Gradient -->
    <linearGradient id="terminalGrad" x1="16" y1="18" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="symbolGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#22D3EE" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Ambient Light Reflection inside Card -->
  <rect x="3" y="3" width="58" height="58" rx="12.5" fill="url(#ambientGlow)"/>

  <!-- Terminal Glyphs with Neon Cyan Aesthetics -->
  <g filter="url(#symbolGlow)">
    <!-- Chevron '>' -->
    <path d="M 18 19 L 30 31.5 L 18 44" 
          fill="none"
          stroke="url(#terminalGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Cursor '_' (Pill rectangle for robust rendering across all browsers) -->
    <rect x="33.5" y="38.5" width="13" height="5.5" rx="2.75" fill="url(#terminalGrad)"/>
  </g>
</svg>